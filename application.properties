# ===================================================================
# Task Scheduler - Application Configuration
# ===================================================================

server.port=8080

# ---------------------------------------------------------------
# DATABASE - Default: H2 file-based DB. Zero setup, data persists
# in ./data/tasksdb.mv.db between restarts. Great for running the
# project locally or for a demo without installing MySQL.
# ---------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/tasksdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 web console (optional, browse your DB at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------
# To switch to MySQL instead of H2 (recommended once you want to
# show this project as a "real" production-style setup):
#
# 1) Create a database:  CREATE DATABASE taskscheduler;
# 2) Comment out the H2 block above
# 3) Uncomment the block below and update credentials
# ---------------------------------------------------------------
# spring.datasource.url=jdbc:mysql://localhost:3306/taskscheduler?createDatabaseIfNotExist=true
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=your_password
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# spring.jpa.hibernate.ddl-auto=update

# ---------------------------------------------------------------
# Logging
# ---------------------------------------------------------------
logging.level.com.taskscheduler=INFO
