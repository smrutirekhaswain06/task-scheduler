<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Scheduler Dashboard</title>
<style>
  :root {
    --bg: #0f1220;
    --panel: #171b2e;
    --panel-2: #1e2338;
    --border: #2a2f4a;
    --text: #e7e9f5;
    --muted: #9297b3;
    --accent: #6c8cff;
    --pending: #f5b942;
    --running: #4fb0ff;
    --completed: #4fd18b;
    --failed: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  .container { max-width: 1100px; margin: 0 auto; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 12px;
  }
  h1 { font-size: 22px; margin: 0; }
  h1 span { color: var(--accent); }
  .subtitle { color: var(--muted); font-size: 13px; margin-top: 4px; }

  .stats {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    text-align: center;
  }
  .stat-card .num { font-size: 22px; font-weight: 700; }
  .stat-card .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .panel h2 { font-size: 15px; margin: 0 0 16px 0; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .form-grid .full { grid-column: 1 / -1; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  input, select, textarea {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 9px 10px;
    color: var(--text);
    font-size: 13px;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  .checkbox-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .checkbox-row input { width: auto; }

  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 10px 18px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 14px;
  }
  button:hover { opacity: 0.9; }

  .filters { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .filter-btn {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
    margin: 0;
  }
  .filter-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; }
  tr:hover { background: rgba(255,255,255,0.02); }

  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
  }
  .badge.PENDING { background: rgba(245,185,66,0.15); color: var(--pending); }
  .badge.RUNNING { background: rgba(79,176,255,0.15); color: var(--running); }
  .badge.COMPLETED { background: rgba(79,209,139,0.15); color: var(--completed); }
  .badge.FAILED { background: rgba(255,107,107,0.15); color: var(--failed); }

  .del-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 4px 10px;
    font-size: 12px;
    margin: 0;
  }
  .del-btn:hover { border-color: var(--failed); color: var(--failed); }

  .empty { text-align: center; color: var(--muted); padding: 30px; }
  .muted-small { font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
<div class="container">

  <header>
    <div>
      <h1>⚙ Task <span>Scheduler</span></h1>
      <div class="subtitle">Distributed-style job scheduling with retry &amp; backoff — auto-refreshing every 5s</div>
    </div>
  </header>

  <div class="stats" id="stats">
    <div class="stat-card"><div class="num" id="stat-total">0</div><div class="label">Total</div></div>
    <div class="stat-card"><div class="num" id="stat-pending">0</div><div class="label">Pending</div></div>
    <div class="stat-card"><div class="num" id="stat-running">0</div><div class="label">Running</div></div>
    <div class="stat-card"><div class="num" id="stat-completed">0</div><div class="label">Completed</div></div>
    <div class="stat-card"><div class="num" id="stat-failed">0</div><div class="label">Failed</div></div>
  </div>

  <div class="panel">
    <h2>Create New Task</h2>
    <form id="task-form">
      <div class="form-grid">
        <div>
          <label>Task Name</label>
          <input type="text" id="name" required placeholder="e.g. Send weekly report">
        </div>
        <div>
          <label>Type</label>
          <select id="type">
            <option value="LOG_MESSAGE">Log Message</option>
            <option value="GENERATE_REPORT">Generate Report</option>
            <option value="SEND_NOTIFICATION">Send Notification (unreliable, demos retries)</option>
          </select>
        </div>
        <div class="full">
          <label>Description</label>
          <textarea id="description" rows="2" placeholder="What should this task do?"></textarea>
        </div>
        <div>
          <label>Scheduled Time</label>
          <input type="datetime-local" id="scheduledTime" required>
        </div>
        <div>
          <label>Max Retries</label>
          <input type="number" id="maxRetries" value="3" min="0" max="10">
        </div>
        <div class="full">
          <div class="checkbox-row">
            <input type="checkbox" id="recurring">
            <label style="margin:0;">Recurring task</label>
          </div>
        </div>
        <div id="interval-field" style="display:none;">
          <label>Repeat every (seconds)</label>
          <input type="number" id="intervalSeconds" value="60" min="5">
        </div>
      </div>
      <button type="submit">+ Create Task</button>
    </form>
  </div>

  <div class="panel">
    <h2>All Tasks</h2>
    <div class="filters">
      <button class="filter-btn active" data-status="">All</button>
      <button class="filter-btn" data-status="PENDING">Pending</button>
      <button class="filter-btn" data-status="RUNNING">Running</button>
      <button class="filter-btn" data-status="COMPLETED">Completed</button>
      <button class="filter-btn" data-status="FAILED">Failed</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>ID</th><th>Name</th><th>Type</th><th>Status</th>
          <th>Scheduled</th><th>Retries</th><th>Last Result</th><th></th>
        </tr>
      </thead>
      <tbody id="task-list">
        <tr><td colspan="8" class="empty">Loading tasks...</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script>
const API = '/api/tasks';
let currentFilter = '';

document.getElementById('recurring').addEventListener('change', (e) => {
  document.getElementById('interval-field').style.display = e.target.checked ? 'block' : 'none';
});

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.status;
    loadTasks();
  });
});

document.getElementById('task-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const recurring = document.getElementById('recurring').checked;
  const payload = {
    name: document.getElementById('name').value,
    description: document.getElementById('description').value,
    type: document.getElementById('type').value,
    scheduledTime: document.getElementById('scheduledTime').value,
    maxRetries: parseInt(document.getElementById('maxRetries').value),
    intervalSeconds: recurring ? parseInt(document.getElementById('intervalSeconds').value) : null
  };
  const res = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
  if (res.ok) {
    e.target.reset();
    document.getElementById('interval-field').style.display = 'none';
    loadTasks();
    loadStats();
  } else {
    alert('Failed to create task. Check that all required fields are filled.');
  }
});

async function deleteTask(id) {
  if (!confirm('Delete this task?')) return;
  await fetch(`${API}/${id}`, { method: 'DELETE' });
  loadTasks();
  loadStats();
}

function formatDate(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  return d.toLocaleString();
}

async function loadTasks() {
  const url = currentFilter ? `${API}?status=${currentFilter}` : API;
  const res = await fetch(url);
  const tasks = await res.json();
  const tbody = document.getElementById('task-list');

  if (tasks.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="empty">No tasks yet. Create one above!</td></tr>';
    return;
  }

  tasks.sort((a, b) => b.id - a.id);

  tbody.innerHTML = tasks.map(t => `
    <tr>
      <td>#${t.id}</td>
      <td>
        ${t.name}
        ${t.intervalSeconds ? '<div class="muted-small">🔁 every ' + t.intervalSeconds + 's</div>' : ''}
      </td>
      <td class="muted-small">${t.type.replace('_',' ')}</td>
      <td><span class="badge ${t.status}">${t.status}</span></td>
      <td class="muted-small">${formatDate(t.scheduledTime)}</td>
      <td>${t.retryCount} / ${t.maxRetries}</td>
      <td class="muted-small">${t.lastResult ? t.lastResult.substring(0,40) : '-'}</td>
      <td><button class="del-btn" onclick="deleteTask(${t.id})">Delete</button></td>
    </tr>
  `).join('');
}

async function loadStats() {
  const res = await fetch(`${API}/stats`);
  const stats = await res.json();
  document.getElementById('stat-total').textContent = stats.total;
  document.getElementById('stat-pending').textContent = stats.pending;
  document.getElementById('stat-running').textContent = stats.running;
  document.getElementById('stat-completed').textContent = stats.completed;
  document.getElementById('stat-failed').textContent = stats.failed;
}

function init() {
  loadTasks();
  loadStats();
  setInterval(() => { loadTasks(); loadStats(); }, 5000);
}
init();
</script>
</body>
</html>
